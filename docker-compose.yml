
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales-forecast-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales-forecast-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
